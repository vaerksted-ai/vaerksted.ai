<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Not found — Værksted</title>
  <meta name="description" content="Not in the workshop's inventory.">
  <meta name="theme-color" content="#07080D">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --void: #07080D;
      --frost: #EDEFF3;
      --mist: #8B939F;
      --line: rgba(232, 200, 121, 0.14);
      --line-strong: rgba(232, 200, 121, 0.30);
      --gold: #E8C879;
      --gold-metal: linear-gradient(180deg,
        #F7E7B0 0%, #E6C56F 38%, #B8893A 52%, #EBD083 72%, #F7E7B0 100%);
      --c-red:    #F26D6D;
      --c-amber:  #F2A33C;
      --c-green:  #4FD08A;
      --c-cyan:   #38C5E0;
      --c-blue:   #5B8DEF;
      --c-violet: #B07CF6;
      --bifrost: linear-gradient(100deg,
        var(--c-red), var(--c-amber), var(--c-green),
        var(--c-cyan), var(--c-blue), var(--c-violet));
      --signal: var(--c-blue);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background:
        radial-gradient(ellipse 120% 90% at 50% 30%, #1A1733 0%, #0C0B1A 40%, var(--void) 75%);
      color: var(--frost);
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 40px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        url('/stars.svg') center / cover no-repeat,
        linear-gradient(to right, var(--line) 1px, transparent 1px) center / 72px 72px,
        linear-gradient(to bottom, var(--line) 1px, transparent 1px) center / 72px 72px;
      -webkit-mask-image: radial-gradient(ellipse 75% 75% at 50% 45%, #000 0%, transparent 78%);
      mask-image: radial-gradient(ellipse 75% 75% at 50% 45%, #000 0%, transparent 78%);
      opacity: 0.65;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 50% 40% at 50% 18%, rgba(232, 200, 121, 0.12) 0%, transparent 70%),
        radial-gradient(circle at 38% 30%, rgba(91, 141, 239, 0.10) 0%, transparent 46%),
        radial-gradient(circle at 62% 34%, rgba(176, 124, 246, 0.08) 0%, transparent 46%);
      pointer-events: none;
    }
    .wrap { max-width: 640px; text-align: left; position: relative; z-index: 1; margin: auto 0; padding: 64px 0; }

    /* ─── Top bar (shared with index.html) ───── */
    header {
      padding: 28px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--line);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--mist);
    }
    header .mark { color: var(--gold); font-weight: 500; letter-spacing: 0.08em; }
    header .mark a { color: inherit; text-decoration: none; }
    header .meta { display: flex; gap: 32px; }

    /* ─── Footer (shared with index.html) ────── */
    footer {
      padding: 64px 0 48px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 40px;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--mist);
    }
    footer a {
      color: var(--frost);
      text-decoration: none;
      border-bottom: 1px solid var(--line-strong);
      padding-bottom: 2px;
      transition: all 0.2s ease;
    }
    footer a:hover { color: var(--gold); border-color: var(--gold); }
    .footer-mark {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 34px;
      font-weight: 600;
      text-transform: none;
      letter-spacing: -0.04em;
      line-height: 1;
      margin-bottom: 14px;
      background: var(--gold-metal);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }
    .footer-mark .ae {
      background: var(--bifrost);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }
    .footer-col {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: flex-start;
    }
    .footer-label { color: var(--gold); letter-spacing: 0.24em; }
    .footer-right { align-items: flex-end; }
    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .eyebrow::before {
      content: '';
      width: 32px;
      height: 2px;
      border-radius: 1px;
      background: var(--bifrost);
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(80px, 16vw, 200px);
      line-height: 0.9;
      letter-spacing: -0.05em;
      font-weight: 600;
      margin-bottom: 32px;
    }
    h1 .accent {
      background: var(--bifrost);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }
    p {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(22px, 3vw, 34px);
      line-height: 1.25;
      letter-spacing: -0.02em;
      margin-bottom: 40px;
      color: var(--frost);
    }
    .back {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--frost);
      text-decoration: none;
      border-bottom: 1px solid var(--line-strong);
      padding-bottom: 4px;
      transition: all 0.2s ease;
    }
    .back:hover { color: var(--gold); border-color: var(--gold); }
    .back::before { content: '← '; }
    @media (max-width: 820px) {
      .container { padding: 0 24px; }
      header .meta { gap: 18px; }
      header .meta span:nth-child(3) { display: none; }
      footer {
        flex-direction: column;
        align-items: flex-start;
        gap: 32px;
        padding: 48px 0 40px;
      }
      .footer-right { align-items: flex-start; }
    }
    @media (max-width: 480px) {
      .container { padding: 0 18px; }
      header {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
        padding: 22px 0;
      }
      header .meta { gap: 14px; flex-wrap: wrap; }
      .footer-mark { font-size: 28px; }
      .wrap { padding: 40px 0; }
      .eyebrow { margin-bottom: 24px; }
      h1 { margin-bottom: 24px; }
      p { margin-bottom: 32px; }
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- header-start -->
    <header>
      <div class="mark"><a href="/">Værksted</a></div>
      <div class="meta">
        <span>EST. MMXXVI</span>
        <span>København</span>
        <span>vaerksted.ai</span>
      </div>
    </header>
    <!-- header-end -->

    <div class="wrap">
      <div class="eyebrow">Error · 404</div>
      <h1>4<span class="accent">0</span>4</h1>
      <p>Not in the workshop's inventory.</p>
      <a class="back" href="/">Back to Værksted</a>
    </div>

    <!-- footer-start -->
    <footer>
      <div class="footer-brand">
        <div class="footer-mark">V<span class="ae">æ</span>rksted</div>
        <div>© MMXXVI · All rights reserved</div>
      </div>
      <nav class="footer-col" aria-label="Group products">
        <div class="footer-label">Group products</div>
        <a href="https://maskin.io">Maskin</a>
        <a href="https://skjald.app">Skjald</a>
        <a href="https://sindre.ai">Sindre</a>
        <a href="https://syntheticpractitioner.com">Rask</a>
      </nav>
      <div class="footer-col footer-right">
        <div class="footer-label">Elsewhere</div>
        <a href="mailto:hej@vaerksted.ai?subject=vaerksted.ai%2F404&amp;body=How%20did%20you%20find%20us%3F%20%2F%20Hvordan%20fandt%20du%20os%3F%0A%0A">hej@vaerksted.ai</a>
        <a href="https://vaerksted.ai/bookseb">Book a call</a>
        <a href="https://github.com/vaerksted-ai" rel="me noopener" target="_blank">GitHub</a>
        <span>vaerksted.ai · vaerksted.org</span>
      </div>
    </footer>
    <!-- footer-end -->

  </div>
</body>
</html>
